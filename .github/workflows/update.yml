name: Update data and site

# The site's morning run (aios-harness#140): take the bill-already-paid model's results file
# (written by its own robot, richardjlyon/model-bill-already-paid, on the same schedule),
# build the site data and share cards from it, commit, and deploy. GitHub often starts
# scheduled runs hours late, so this run waits (up to 3 hours) for the file the model wrote
# today, then builds from the latest it has. fetch-results refuses a file from any model
# version other than the pin (reference/results_pin.yaml), or one whose fingerprint does not
# match: with no file to build from the run fails, and yesterday's site stays live.

on:
  schedule:
    - cron: "30 5 * * *"   # daily 05:30 UTC, with the model's run; waits for its results below
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Take the model's results file (refused unless it is the pinned version's)
        run: |
          for i in $(seq 1 18); do
            if uv run python -m clocksite fetch-results && uv run python -c "import json, datetime, sys; g = json.load(open('results/clock.json'))['meta']['generated_at'][:10]; sys.exit(g != datetime.datetime.now(datetime.timezone.utc).date().isoformat())"; then
              exit 0
            fi
            echo "today's results file is not there yet; waiting 10 minutes ($i of 18)"; sleep 600
          done
          echo "::warning::no results file from today after 3 hours: building from the latest one"
          test -f results/clock.json
      - run: uv run python -m clocksite build-site
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('uv.lock') }}
      - name: Install Chromium for share cards
        run: uv run playwright install --with-deps chromium
      - name: Rebuild share cards
        # a render failure never blocks the data update - yesterday's dated cards remain live
        run: uv run python -m clocksite build-cards || echo "::warning::share cards failed - previous cards remain"
      - name: Commit updated data
        run: |
          git config user.name "subsidy-counter-bot"
          git config user.email "actions@users.noreply.github.com"
          # site/papers: a frozen paper's og:image carries the headline card's
          # content-hash token, which build-cards re-stamps when the card changes
          git add site/data site/share site/s site/embed site/index.html site/papers
          git diff --cached --quiet || git commit -m "data: scheduled update $(date -u +%F)"
          git push
      - name: Deploy to Cloudflare Pages
        # deployed every run, not only when data changed: a stale live clock is
        # a silent failure, so the deploy is explicit rather than push-triggered
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 99b63c8b76711ecc6e202087e5860cc2
        run: npx -y wrangler@4.144.0 pages deploy site --project-name=subsidy-clock --branch=master --commit-dirty=true
