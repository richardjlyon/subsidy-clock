  tnuos:
    # the annual series below is raw total revenue; the published scheme series
    # is the attributed uplift money.py derives from it, so the public label
    # must describe that, not the input (2026-06-12 audit item 6)
    label: Transmission Network Use of System (attributed uplift)
    perspectives: []
    cadence: annual
    year_basis: calendar
    source: >-
      The shared cost register (reference/register_pin.yaml), line TNUOS, its
      primary-source series of the whole charge (demand and generators'
      parts), calendar years: 2006-24 from Ofgem's TPCR4 final proposals and
      Transmission Annual Reports and NESO's TNUoS tariff statements, charging
      years weighted to calendar years (1/4 previous + 3/4 own); 2002-05 the
      gas-counterfactual engine's assembled transmission owners' allowances
      (NGC, SP Transmission, SHETL; no GB charge before BETTA). Richard's
      rulings of 1 Nov 2026 (primary sources; calendar years;
      aios-harness#43).
    source_url: https://www.neso.energy/industry-information/charging/tnuos-charges
    verified: false
    expected_next_update: 2027-02-28   # NESO TNUoS charging statements
    attribution:
      rule: >-
        Raw totals stored; attribution happens in the money model. Only each
        year's cost above what the same year would have cost without net-zero
        policy (the gas-counterfactual engine's high-voltage grid road, GO5,
        reference/model_pin.yaml) is attributed; a year below it counts as
        negative (signed years, as Reliable Britain).
      confidence: low
    note: >-
      Raw annual TNUoS, calendar years 2002-2024. The build reads every closed
      year from the shared cost register; the figures below are the
      register's, copied here so the file says what the Clock counts. Until 1
      Nov 2026 the Clock keyed each April-March charging year to the calendar
      year it starts in, from NESO via David Turver's workbook (2013-24) and
      a third-party compilation (2005-12).
