  bsuos_history:
    label: Balancing Services Use of System, pre-2017 history (raw totals)
    perspectives: []
    cadence: annual
    source: >-
      The shared cost register (reference/register_pin.yaml), line BSUOS, its
      primary-source series: 2006-16 from Ofgem's Transmission Annual Reports
      (2008-09, 2009-10), National Grid's Monthly Balancing Services Summaries
      (March 2011-2016) and the NAO's "Electricity Balancing Services" (May
      2014, HC 41), charging years weighted to calendar years (1/4 previous +
      3/4 own); 2002-05 the gas-counterfactual engine's modelled base (no
      comparable charge series exists). Richard's ruling of 1 Nov 2026
      (option B, primary sources; aios-harness#43).
    source_url: https://www.nao.org.uk/wp-content/uploads/2014/05/Electricity-Balancing-Services.pdf
    verified: false
    # expected_next_update: none — static: series ends 2016, where the fetched BSUoS data takes over. No refresh.
    # Pin: first year the fetched NESO series replaces this history (aios-harness#37,
    # 1 Nov 2026). 2017 is the year the old "first year held from 1 Jan" rule gave, so no
    # figure moved. Changing it is a release decision and moves LIVE_PIN in
    # src/subsidy_engine_uk/splice.py with it; the build refuses an unsafe pin.
    bottom_up_from: 2017
    attribution:
      rule: >-
        Raw totals stored; attribution happens in the money model. Only the
        increase above the CPIH-indexed 2002-05 baseline (GBP 0.4bn/yr) is
        attributed, NET of wind constraint payments already counted in the
        direct layer, floored at zero. The estimated cost of replacing
        switched-off wind (constraint turn-up) is then shown as its own line
        and taken out of this one.
      confidence: low
    note: >-
      Raw annual BSUoS, calendar years 2002-2016, before the first full
      calendar year the settled NESO series covers (2017). The build reads
      every closed year from the shared cost register; the figures below are
      the register's, copied here so the file says what the Clock counts.
      BASIS - this series and the fetched series are both GROSS BSUoS (the
      balancing cost recovered from users, generators' and demand parts), or
      the build splices two definitions mid-run (the defect corrected on
      2026-09-30, amendment `bsuos-basis-2026-09-30`). Being on calendar years,
      the series no longer counts January-March 2017 in both 2016 and 2017.
