# Versioned reference inputs for the INDIRECT subsidy layer (Phase 2).
# Values are nominal GBP, keyed by calendar year. Where the underlying source
# reports fiscal years (Apr-Mar), the value is attributed to the calendar year
# in which the period starts. CCL and ETS store ALREADY-ATTRIBUTED values
# (electricity / power-sector share); TNUoS and bsuos_history store RAW totals
# and attribution happens later in the money model. Refresh annually; cite the
# exact source consulted.
schemes:
  ccl:
    label: Climate Change Levy (electricity share)
    perspectives: []
    cadence: annual
    year_basis: calendar
    source: >-
      HMRC Environmental Taxes Bulletin (formerly Climate Change Levy and
      Carbon Price Floor Bulletin), March 2026 edition, tables ODS
      (2026_March_env_tabs_test.ods), Table 1b "CCL and CPF receipts and
      clearances data by calendar year": electricity main-rate declared
      liabilities (the only commodity split HMRC publishes), rounded down to
      the nearest GBP 0.1m, as read by the shared cost register (line
      CCL_ELEC). Carbon Price Support is not in this line: it is part of the
      carbon line's tax collected (aios-harness#44).
    source_url: https://www.gov.uk/government/statistics/environmental-taxes-bulletin
    verified: true
    expected_next_update: 2027-03-31   # HMRC Environmental Taxes Bulletin, March edition
    attribution:
      rule: >-
        Electricity's share of CCL main-rate liabilities (HMRC's published
        commodity split of declarations). Gas/solid-fuel main-rate CCL is
        excluded. Carbon Price Support is counted in the carbon line.
      confidence: medium
    note: >-
      Main-rate figures are accrued declarations rather than cash receipts
      because receipts have no commodity split. The build reads every closed
      year from the shared cost register; the figures below are the
      register's, copied here so the file says what the Clock counts.
