# The ONE source of every counterfactual figure in the Clock (Richard Lyon, 14 Oct 2026).
#
# The Clock measures what was paid (RO, FiT, CfD, constraint payments, CCL, ETS,
# the raw TNUoS and BSUoS series). The only figures in it about what would have
# happened without net zero are:
#   - the Capacity Market net-zero share per year (spec 5.4 of the engine), and
#   - the no-net-zero grid and balancing cost per year (engine GO5 and GO4,
#     generators' share included), subtracted from the Clock's measured TNUoS
#     and BSUoS. One method in both models (Richard, 14 Oct 2026): grid = the
#     2002-05 cost carried by the regulator's index (RPI, then CPIH) plus the
#     renewal allowance; balancing = the 2002-05 cost split into a gas-price
#     energy part and a CPIH services part. Years after the engine's last year
#     carry its last-year figure by CPIH (the rule is stated in the export).
# Both come from a RELEASED export of the gas-counterfactual engine, vendored
# below and pinned by version and sha256. The build fails if the vendored file
# does not match this pin (tests/test_model_pin.py says the same). A new engine
# release is never applied automatically: to move the Clock to it, vendor the
# new out/clock/<version>.json from the engine repo, edit this pin, rebuild,
# and log the change (changelog.jsonl) - on purpose, with Richard's approval.
#
# Engine registry: gas-counterfactual/releases.yaml (private Gitea aios/gas-counterfactual).
