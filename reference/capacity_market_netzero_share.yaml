# Capacity Market: the part net zero caused (method change of 13 October 2026).
#
# The Clock counts, for each indirect line, only the cost that net-zero policy
# added: TNUoS and BSUoS count growth above a pre-renewables baseline. This file
# brings the Capacity Market under the same rule. Any power system needs backup
# for the coldest, stillest evening, so the levy is not counted in full. What is
# counted is
#
#     counted(y) = CM paid(y) - what "Reliable Britain" would have paid for its own backup in y
#
# where Reliable Britain is the actual GB system with net-zero policy removed
# (no wind or solar build, coal kept open where economic, gas built to meet the
# residual peak; nuclear, imports and pumped storage as they were). Its own
# capacity payment = that year's CM price (GBP/kW/yr: CM paid / average
# obligation in force, LCCC; 2016-17 the T-1 Early Auction clearing price,
# Ofgem CM annual report 2025/26 Table 4) x the de-rated firm capacity it would
# have needed a CM agreement for (existing plant it did not keep open specially,
# unlisted firm plant, nuclear/imports/pumped storage at its peak). New plant,
# the spare margin and kept-open coal are excluded because that model already
# charges them at full build/keep-open cost; counting a capacity payment on them
# as well would pay for the same backup twice.
#
# The Clock applies share(y) = netzero_gbp / cm_paid_gbp to each month's LCCC
# payment in year y (it does not paste in the engine's pounds, so a later LCCC
# restatement of a month moves the line in proportion). The build fails if the
# Clock's own annual CM total drifts more than 2% from cm_paid_gbp in any year
# listed here: the share would then be stale and the engine must be rerun.
#
# FLOOR, not central-high: Reliable Britain is charged the actual GBP/kW. The
# 550 gCO2/kWh CM emissions limit (introduced 2019; binding on existing plant
# from delivery year 2024/25) has kept the ~11 GW of coal that bid into earlier
# T-4 auctions out of every T-4 auction since 2021 (Ofgem, Annual Report on the
# Operation of the CM 2020/21 and 2021/22, section 4), and clearing prices then
# rose; Reliable Britain's coal would have bid in and held
# its price down. No primary source quantifies the net-zero share of that price
# rise, so it is not added. Range: low = kept coal also needs a CM agreement;
# high = the whole levy (the Clock's rule before 13 October 2026).
#
# Years after the last engine year use that year's share (carry_forward_from),
# until the engine is rerun to cover them. Richard Lyon's decision, 13 Oct 2026.
#
# All money nominal GBP, calendar year, as paid.
