# Contextual denominators for viewer-relevant framings (spec M-3).
# Each value carries its official source. Verify on annual refresh.
households:
  value: 29000000
  description: UK households
  source: ONS, Families and households in the UK, 2025 bulletin
  source_url: https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/families/bulletins/familiesandhouseholds/2025
  as_of: 2025
population:
  value: 69300000
  description: UK mid-year population estimate
  source: ONS, Population estimates for the UK, mid-2024
  source_url: https://www.ons.gov.uk/peoplepopulationandcommunity/populationandmigration/populationestimates/bulletins/annualmidyearpopulationestimates/mid2024
  as_of: 2024
annual_demand_twh:
  value: 273.8
  description: >-
    UK electricity final consumption by end users (TWh/year), used for the
    per-MWh-delivered framing. Total demand including losses was 320.2 TWh
    in 2025; the lower final-consumption figure is used so the per-MWh
    framing is not overstated by network losses.
  source: DESNZ Energy Trends, March 2026 statistical release (2025 annual data, section 5 / table 5.2)
  source_url: https://www.gov.uk/government/statistics/electricity-section-5-energy-trends
  as_of: 2025
electricity_consumption_by_nation:
  scotland_gwh: 21657.3
  gb_gwh: 249247.7
  description: >-
    Metered electricity consumption, all sectors, 2024 (Scotland and GB, both
    including unallocated). Used to apportion who pays for constraint payments:
    balancing costs are recovered from suppliers per MWh of final demand, so a
    nation's share of the bill tracks its share of consumption.
  source: DESNZ, Subnational electricity consumption statistics, Electricity consumption by Region, 2005 to 2024
  source_url: https://www.gov.uk/government/statistics/regional-and-local-authority-electricity-consumption-statistics
  data_url: https://assets.publishing.service.gov.uk/media/6942957636f089d38be1f1f8/elec_region_stacked_2005-2024.csv
  as_of: 2024
