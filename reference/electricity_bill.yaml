# Total UK electricity consumer expenditure - the denominator for the
# share-of-bill chart. DUKES 1.3 "Sales of electricity and gas by sector".
# Annual Excel publication (gov.uk), calendar-year keyed; refresh each July.
#
# Verified 2026-09-01 against DUKES_1.3.xlsx (published Thu 30 July 2026),
# sheet "1.3.A" ("Total selling value, GBP million"), row 22 "of which
# electricity". Values rounded to the nearest GBP million.
#
# EDITION: DUKES 2026 (published 2026-07-30). Record the edition with the
# figures - this series is NOT stable between editions. The 2026 Cover Sheet
# states: "The revisions period is 2010 - 2024 ... value balances have been
# revised from 2010 onwards", so the whole series from 2010 was re-read, not
# appended. Against the 2025 edition: 2024 +GBP 614m (+0.94%), 2023 +GBP 686m,
# 2022 -GBP 222m. The previously held 2024 value of 65,579,000,000 was a
# correct reading of the JULY 2025 edition and is now superseded.
#
# ROW LABEL NOTE: the workbook has "Total all consumers" (row 20), "of which
# gas" (row 21) and "of which electricity" (row 22) as three separate rows.
# The composite label used previously here ("Total all consumers - of which
# electricity") is a local convention, not a literal string in the file.
#
# CITATION DISCIPLINE: gov.uk asset URLs are NOT stable citations. The URL
# previously stored here (.../6889eaed8b3a37b63e738fe1/DUKES_1.3.xlsx) now
# 301-redirects to the 2026 workbook, so anyone re-fetching it to check the
# stored 2025 figures silently receives 2026 data. Confirmed 2026-09-01:
# that URL returns SHA-256 1dca0224...c662f, the 2026 file. Superseded
# editions are therefore cited via their National Archives capture only.
#
# WARNING: the 2026 Cover Sheet states DESNZ "plan to carry out a methodology
# review of the value balances in this table over the upcoming year". Expect
# further revision in the July 2027 edition.
