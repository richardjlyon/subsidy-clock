# Fixes Richard approved, and his rulings, that remove a live input held in the shared cost register's
# clock_live adjustments (aios-harness#42, #43; mechanism from card t_b468cbeb). Each names, by item id only, the register adjustment the
# Clock no longer takes (`drop`). This file holds no figures (decision 0168): every number is the register's.
#
# Approval: Richard, 1 Nov 2026, "technical fixes approved, done without further rulings, each tested and
# measured" (report-series/clock-alignment/decisions.md). Anything not approved does not go in this file.

findings:

  cps_from_april_2013:
    status: applied
    kind: data_error
    reason: >-
      Carbon Price Support was charged from 1 April 2013. The live Clock counted it from 2014 because HMRC's
      calendar-year CCL/CPF split starts in 2014. The register's CPS series carries April-December 2013 (the
      engine's estimate); the Clock now takes it.
    approved: "Richard, 1 Nov 2026 (decisions.md, technical fixes: CPS from 1 Apr 2013)"
    definitions: D-10 (i)
    drop: [clock.CPS.not_counted_2013]

  fit_scheme_years_2019_2022:
    status: applied
    kind: data_error
    reason: >-
      The live Clock carried FiT scheme year 2019-20 at 2022-23's Ofgem scheme value and 2022-23 at
      2019-20's. The register's reading of Ofgem's FiT annual reports puts each value in its own scheme year;
      the 2002-24 cash total is unchanged. Ported from hermes/modeller/t_b468cbeb-rb-findings dfe0aaff6.
    approved: "Richard, 1 Nov 2026 (decisions.md, technical fixes: FiT 2019/2022 swap)"
    definitions: D-01 (data error part)
    drop: [clock_live.FIT.sy2019_sy2022_as_published]

  bsuos_history_primary_sources:
    status: ruled
    kind: source
    reason: >-
      The live Clock's BSUoS history 2002-16 was REF's Table 2 (2006-10, 2014-16), the NAO (2005, 2011-13)
      and the flat 2002-05 baseline (2002-04), charging years keyed as calendar years. The register's BSUOS
      series is the primary sources (Ofgem, National Grid, NAO) on calendar years; the Clock now takes it.
    approved: "Richard, 1 Nov 2026 (decisions.md: TNUoS 2005-12, BSUoS history and ETS 2009-11, option B, primary sources)"
    definitions: D-09
    drop: [clock.BSUOS.clock_source_history]

  tnuos_primary_sources_calendar_years:
    status: ruled
    kind: source
    reason: >-
      The live Clock's TNUoS was the flat 2002-05 baseline (2002-04), REF Table 2 (2005-12) and NESO via
      Turver (2013-24), charging years keyed as calendar years. The register's TNUOS series is the primary
      sources on calendar years for every year; taking it for all of 2002-24 keeps one basis (no Jan-Mar 2013
      gap), so 2013-24 move as well.
    approved: "Richard, 1 Nov 2026 (decisions.md: TNUoS 2005-12 option B, primary sources; calendar-year basis D-13); all of 2002-24 per the coordinator, aios-harness#43"
    definitions: D-09, D-13
    drop: [clock.TNUOS.clock_source_history]
