[project]
name = "web-subsidy-clock"
version = "0.1.0"
description = "The Subsidy Clock website (subsidyclock.co.uk), built from the model-bill-already-paid results file"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "playwright>=1.61"]  # 1.61: first with Ubuntu 26.04, the robots' image (aios-harness#142)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clocksite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
